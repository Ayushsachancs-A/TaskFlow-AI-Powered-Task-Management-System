{% extends 'layout.html' %}

{% block title %}Add New Task - TaskFlow AI{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-6">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Add New Task</h1>
            <p class="text-xs text-slate-500 mt-1">Create a new task with automatic AI vector indexing</p>
        </div>
        <a href="/todos/todo-page" class="px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-white border border-slate-200 hover:bg-slate-50 transition-colors flex items-center gap-1.5">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Tasks
        </a>
    </div>

    <div class="bg-white rounded-2xl p-8 border border-slate-200/80 shadow-sm">
        <form id="standaloneAddTodoForm" onsubmit="handleStandaloneCreate(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Task Title <span class="text-rose-500">*</span></label>
                <input 
                    type="text" 
                    id="new_task_title"
                    name="title" 
                    required 
                    minlength="3"
                    oninput="debounceDuplicateCheck()"
                    placeholder="e.g. Prepare quarterly performance review"
                    class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 text-slate-800"
                >
            </div>

            <!-- Live Duplicate Alert -->
            <div id="duplicateAlertBanner" class="hidden p-3 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-800 flex items-start gap-2.5">
                <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-600 shrink-0 mt-0.5"></i>
                <div class="flex-1">
                    <div class="font-semibold" id="duplicateAlertTitle">Duplicate Detected</div>
                    <div class="text-[11px] mt-0.5 text-amber-700" id="duplicateAlertMsg"></div>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Description <span class="text-rose-500">*</span></label>
                <textarea 
                    id="new_task_description"
                    name="description" 
                    required 
                    minlength="3"
                    maxlength="500"
                    rows="4" 
                    oninput="debounceDuplicateCheck()"
                    placeholder="Provide details and actionable context..."
                    class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 text-slate-800"
                ></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Priority</label>
                <select 
                    id="new_task_priority"
                    name="priority" 
                    class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 text-slate-800"
                >
                    <option value="1">🟢 1 - Low Priority</option>
                    <option value="2">🟢 2 - Normal</option>
                    <option value="3" selected>🟡 3 - Medium Priority</option>
                    <option value="4">🔴 4 - High Priority</option>
                    <option value="5">🔥 5 - Urgent Focus</option>
                </select>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                <a href="/todos/todo-page" class="px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100 transition-colors">
                    Cancel
                </a>
                <button type="submit" class="px-5 py-2.5 rounded-xl text-xs font-semibold bg-brand-600 hover:bg-brand-700 text-white shadow-sm shadow-brand-500/20 transition-all flex items-center gap-1.5">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i> Create Task
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

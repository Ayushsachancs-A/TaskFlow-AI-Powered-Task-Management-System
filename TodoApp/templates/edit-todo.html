{% extends 'layout.html' %}

{% block title %}Edit Task - TaskFlow AI{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-6">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Edit Task #{{ todo.id }}</h1>
            <p class="text-xs text-slate-500 mt-1">Update details with live vector store synchronization</p>
        </div>
        <a href="/todos/todo-page" class="px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-white border border-slate-200 hover:bg-slate-50 transition-colors flex items-center gap-1.5">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Tasks
        </a>
    </div>

    <div class="bg-white rounded-2xl p-8 border border-slate-200/80 shadow-sm">
        <form id="standaloneEditTodoForm" onsubmit="handleStandaloneEdit(event, {{ todo.id }})" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Title</label>
                <input 
                    type="text" 
                    name="title" 
                    value="{{ todo.title }}"
                    required 
                    minlength="3"
                    class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 text-slate-800"
                >
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Description</label>
                <textarea 
                    name="description" 
                    required 
                    minlength="3"
                    maxlength="500"
                    rows="4" 
                    class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 text-slate-800"
                >{{ todo.description }}</textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Priority</label>
                    <select 
                        name="priority" 
                        class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 text-slate-800"
                    >
                        <option value="1" {% if todo.priority == 1 %}selected{% endif %}>🟢 1 - Low Priority</option>
                        <option value="2" {% if todo.priority == 2 %}selected{% endif %}>🟢 2 - Normal</option>
                        <option value="3" {% if todo.priority == 3 %}selected{% endif %}>🟡 3 - Medium Priority</option>
                        <option value="4" {% if todo.priority == 4 %}selected{% endif %}>🔴 4 - High Priority</option>
                        <option value="5" {% if todo.priority == 5 %}selected{% endif %}>🔥 5 - Urgent Focus</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Completion Status</label>
                    <div class="flex items-center h-[42px] px-3.5 bg-slate-50 border border-slate-200 rounded-xl gap-2.5">
                        <input 
                            type="checkbox" 
                            id="edit_complete_cb" 
                            name="complete" 
                            {% if todo.complete %}checked{% endif %}
                            class="w-4 h-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500 cursor-pointer"
                        >
                        <label for="edit_complete_cb" class="text-xs font-medium text-slate-700 cursor-pointer">Mark as Completed</label>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                <button type="button" onclick="deleteTaskPrompt({{ todo.id }})" class="px-4 py-2.5 rounded-xl text-xs font-semibold text-rose-600 hover:bg-rose-50 transition-colors flex items-center gap-1.5">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Delete Task
                </button>
                <div class="flex items-center gap-2">
                    <a href="/todos/todo-page" class="px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100 transition-colors">
                        Cancel
                    </a>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-xs font-semibold bg-brand-600 hover:bg-brand-700 text-white shadow-sm shadow-brand-500/20 transition-all flex items-center gap-1.5">
                        <i data-lucide="check" class="w-3.5 h-3.5"></i> Save Changes
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}

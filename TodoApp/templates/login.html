{% extends 'layout.html' %}

{% block title %}Sign In - TaskFlow AI{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-6">
    <div class="w-full max-w-md">
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-600 items-center justify-center text-white shadow-lg shadow-brand-500/25 mb-3">
                <i data-lucide="check-check" class="w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Welcome Back</h1>
            <p class="text-xs text-slate-500 mt-1">Sign in to access your task dashboard and AI Copilot</p>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-2xl p-8 border border-slate-200/80 shadow-xl shadow-slate-200/50">
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Username</label>
                    <div class="relative">
                        <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                        <input 
                            type="text" 
                            name="username" 
                            required 
                            autocomplete="username" 
                            placeholder="Enter your username"
                            class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all text-slate-800 placeholder:text-slate-400"
                        >
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                        <input 
                            type="password" 
                            name="password" 
                            required 
                            autocomplete="current-password" 
                            placeholder="••••••••"
                            class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all text-slate-800 placeholder:text-slate-400"
                        >
                    </div>
                </div>

                <button 
                    type="submit" 
                    id="loginSubmitBtn"
                    class="w-full py-2.5 px-4 rounded-xl text-sm font-semibold bg-brand-600 hover:bg-brand-700 text-white shadow-md shadow-brand-500/25 transition-all flex items-center justify-center gap-2 mt-2"
                >
                    <span>Sign In</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-500">
                    Don't have an account yet? 
                    <a href="/auth/register-page" class="font-semibold text-brand-600 hover:text-brand-700 underline ml-1">Create Account</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
